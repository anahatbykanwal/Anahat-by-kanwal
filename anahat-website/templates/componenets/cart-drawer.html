<!-- Mini Cart Drawer Component -->
<aside class="mini-drawer" id="miniDrawer" aria-label="Shopping panel" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawerTitle">Your Shopping Bag</h2>
    <button class="icon-button" id="closeDrawer" aria-label="Close panel"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="drawerContent" class="drawer-content">
    <!-- Dynamic Cart Items will be injected here -->
  </div>
  <div class="drawer-footer" id="drawerFooter">
    <!-- Dynamic Subtotal and Checkout Buttons will be injected here -->
  </div>
</aside>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
